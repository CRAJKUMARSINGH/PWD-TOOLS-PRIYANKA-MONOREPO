[build]
  # Run from monorepo root so workspace:* packages resolve correctly
  base    = "."
  command = "pnpm install --no-frozen-lockfile && cd artifacts/pwd-tools && npx vite build --config vite.config.ts"
  publish = "artifacts/pwd-tools/dist/public"

[build.environment]
  PORT         = "3000"
  BASE_PATH    = "/"
  NODE_ENV     = "production"
  PNPM_VERSION = "10.33.0"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
