[build]
  # Run from monorepo root so workspace:* packages resolve correctly
  base    = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/pwd-tools run build"
  publish = "artifacts/pwd-tools/dist/public"

[build.environment]
  PORT      = "3000"
  BASE_PATH = "/"
  NODE_ENV  = "production"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
